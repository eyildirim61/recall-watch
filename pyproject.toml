[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-watch"
version = "0.1.0"
description = "Check FDA food recalls against your own product list every day, matching by barcode and brand."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Elif Yıldırım" }]
keywords = ["food safety", "recall", "fda", "openfda", "gtin", "upc", "barcode", "github actions"]
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=7"]

[project.scripts]
recall-watch = "recall_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
